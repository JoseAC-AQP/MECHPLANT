<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIM-01: STRESSLAB 3D — Simulador de Análisis de Esfuerzos Mecánicos | MECHPLANT</title>
  <meta name="description" content="Laboratorio virtual interactivo en 3D para análisis de esfuerzos normales, cortantes, flexión, torsión, esfuerzos combinados y factores de seguridad en elementos de máquinas y estructuras industriales." />

  <!-- Estilos globales MECHPLANT -->
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/reset.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/navbar.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />

  <!-- Base de datos y navegación global MECHPLANT -->
  <script src="../assets/js/db.js"></script>
  <script defer src="../assets/js/navbar.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #F8FAFC;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .sl-embed-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: calc(100vh - 64px);
    }

    .sl-embed-frame {
      flex: 1;
      width: 100%;
      height: calc(100vh - 64px);
      border: none;
      display: block;
      background: #F8FAFC;
    }

    .sl-fallback-notice {
      display: none;
      max-width: 720px;
      margin: 48px auto;
      padding: 24px 28px;
      background: #FFFFFF;
      border: 1px solid #CBD5E1;
      border-left: 5px solid #0EA5E9;
      border-radius: 10px;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: #0F172A;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .sl-fallback-notice h2 {
      margin: 0 0 10px;
      font-size: 1.15rem;
      color: #0B192C;
    }

    .sl-fallback-notice p {
      margin: 0 0 10px;
      line-height: 1.55;
      color: #475569;
      font-size: 0.92rem;
    }

    .sl-fallback-notice code {
      background: #F1F5F9;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 0.85rem;
      color: #0284C7;
    }
  </style>
</head>
<body data-root="../" data-section="simuladores" data-breadcrumb="SIM-01 · STRESSLAB 3D">

  <!-- Barra de navegación global MECHPLANT -->
  <header id="mp-global-header" class="mp-header"></header>

  <!-- Contenedor principal de STRESSLAB 3D -->
  <main class="sl-embed-wrapper">
    <iframe
      id="stresslabFrame"
      src="./sim-01/index.html"
      class="sl-embed-frame"
      title="STRESSLAB 3D — Simulador de Análisis de Esfuerzos Mecánicos"
      loading="eager"
      allowfullscreen>
    </iframe>

    <!-- Aviso de diagnóstico si aún no se copió la carpeta compilada dist/ -->
    <div id="fallbackNotice" class="sl-fallback-notice" role="alert">
      <h2>No se encontró la aplicación compilada en <code>simuladores/sim-01/index.html</code></h2>
      <p>
        Para activar la interfaz completa de <strong>STRESSLAB 3D</strong>, asegúrate de haber configurado <code>base: './'</code> en <code>vite.config.ts</code>, ejecutado <code>npm run build</code> y copiado el contenido generado dentro de <code>dist/</code> hacia la carpeta:
      </p>
      <p style="margin-bottom: 0;"><code>simuladores/sim-01/</code></p>
    </div>
  </main>

  <script>
    (function () {
      const frame = document.getElementById('stresslabFrame');
      const fallback = document.getElementById('fallbackNotice');

      // Ajustar altura exacta del iframe descontando el encabezado dinámico de navbar.js
      function adjustFrameHeight() {
        const header = document.getElementById('mp-global-header');
        const headerH = header && header.offsetHeight > 0 ? header.offsetHeight : 64;
        const availableH = Math.max(480, window.innerHeight - headerH);
        frame.style.height = availableH + 'px';
        frame.style.minHeight = availableH + 'px';
      }

      window.addEventListener('resize', adjustFrameHeight);
      window.addEventListener('DOMContentLoaded', function () {
        adjustFrameHeight();
        // Reajuste tras la renderización asíncrona de navbar.js
        setTimeout(adjustFrameHeight, 150);
      });

      // Registrar acceso en el historial de MECHPLANT (db.js)
      if (window.MP_DB && typeof window.MP_DB.logCalculation === 'function') {
        try {
          window.MP_DB.logCalculation('SIM-01', 'STRESSLAB-3D', { status: 'loaded' });
        } catch (err) {
          console.warn('No se pudo registrar la sesión en MP_DB:', err);
        }
      }

      // Verificar disponibilidad de la app compilada (solo en entornos HTTP/HTTPS)
      if (window.location.protocol.startsWith('http')) {
        fetch('./sim-01/index.html', { method: 'HEAD' })
          .then(function (res) {
            if (!res.ok) {
              frame.style.display = 'none';
              fallback.style.display = 'block';
            }
          })
          .catch(function () {
            frame.style.display = 'none';
            fallback.style.display = 'block';
          });
      }
    })();
  </script>
</body>
</html>
