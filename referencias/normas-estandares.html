<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Normas y Estándares Internacionales | MECHPLANT</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#0B192C" />

  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/reset.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/navbar.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/math-diagrams.css" />
  <link rel="stylesheet" href="../assets/css/print.css" media="print" />
</head>
<body data-root="../">
  <header id="mp-navbar"></header>

  <main class="mp-container" style="padding-top: 28px; padding-bottom: 48px;">
    <nav aria-label="Ruta de navegación" style="font-size: 0.84rem; color: var(--text-muted); margin-bottom: 14px;">
      <a href="../index.html">Inicio</a> &rsaquo; <a href="index.html">Referencias</a> &rsaquo; <strong>Normas y Estándares</strong>
    </nav>

    <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; margin-bottom: 24px;">
      <div>
        <span class="tech-badge tech-badge--cyan">NORMATIVA DE DISEÑO Y MANTENIMIENTO</span>
        <h1 style="font-size: 1.75rem; color: var(--color-navy-800); margin-top: 6px;">Normas y Estándares Internacionales</h1>
        <p style="color: var(--text-secondary); font-size: 0.92rem; max-width: 72ch;">
          Especificaciones técnicas vigentes para el cálculo, tolerancias de montaje, selección de componentes y monitoreo de condición en activos industriales.
        </p>
      </div>

      <div style="display: flex; gap: 8px; flex-wrap: wrap;" id="normas-filter-bar">
        <button type="button" class="btn btn--primary" data-org="ALL">Todas</button>
        <button type="button" class="btn btn--outline-dark" data-org="ISO">ISO</button>
        <button type="button" class="btn btn--outline-dark" data-org="AGMA">AGMA</button>
        <button type="button" class="btn btn--outline-dark" data-org="DIN">DIN</button>
        <button type="button" class="btn btn--outline-dark" data-org="SAE">SAE</button>
        <button type="button" class="btn btn--outline-dark" data-org="API">API</button>
        <button type="button" class="btn btn--outline-dark" data-org="ASME">ASME / ANSI</button>
      </div>
    </div>

    <div id="normas-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 18px;"></div>
  </main>

  <script src="../assets/js/data/db-curriculum.js"></script>
  <script src="../assets/js/data/db-equipos.js"></script>
  <script src="../assets/js/data/db-componentes.js"></script>
  <script src="../assets/js/data/db-normas.js"></script>
  <script src="../assets/js/core/navbar.js"></script>
  <script src="../assets/js/core/search-engine.js"></script>
  <script src="../assets/js/core/unit-converter.js"></script>
  <script src="../assets/js/core/progress-tracker.js"></script>
  <script src="../assets/js/core/app-init.js"></script>

  <script>
    (function () {
      const FALLBACK_NORMAS = [
        { codigo: "ISO 281", organismo: "ISO", titulo: "Rodamientos — Cargas dinámicas y vida nominal (L10)", aplicacion: "Cálculo de vida básica en millones de revoluciones y horas de servicio para rodamientos de bolas (p=3) y rodillos (p=10/3).", simulador: "../simuladores/sim-07-seleccion-vida-rodamientos.html" },
        { codigo: "ISO 286-1 / 286-2", organismo: "ISO", titulo: "Sistema ISO de tolerancias para dimensiones lineales (Ajustes eje-agujero)", aplicacion: "Selección de ajustes con juego (H7/g6, H7/f7), transición (H7/k6) e interferencia (H7/m6, H7/p6) en ejes, poleas y alojamientos.", simulador: "../simuladores/sim-03-tolerancias-ajustes.html" },
        { codigo: "ISO 20816-3", organismo: "ISO", titulo: "Vibración mecánica — Evaluación de máquinas industriales (> 15 kW)", aplicacion: "Clasificación de severidad vibratoria RMS (mm/s) en Zonas A, B, C y D según potencia de máquina y rigidez de cimentación.", simulador: "../simuladores/sim-14-vibraciones-confiabilidad.html" },
        { codigo: "ISO 14224", organismo: "ISO", titulo: "Recolección e intercambio de datos de confiabilidad y mantenimiento", aplicacion: "Estandarización de taxonomía de equipos, modos de falla y cálculo de MTBF, MTTR, tasa de fallas y disponibilidad.", simulador: "../simuladores/sim-14-vibraciones-confiabilidad.html" },
        { codigo: "ANSI/AGMA 2001-D04", organismo: "AGMA", titulo: "Factores fundamentales de resistencia para dientes de engranajes involutos", aplicacion: "Evaluación de resistencia a la flexión en raíz del diente y picadura por contacto (pitting) en reductores de potencia.", simulador: "../simuladores/sim-10-diseno-engranajes.html" },
        { codigo: "DIN 6885-1", organismo: "DIN", titulo: "Chavetas paralelas y chaveteros — Dimensiones y tolerancias", aplicacion: "Dimensionamiento normalizado (ancho b × altura h) en función del diámetro del eje y verificación por corte y aplastamiento.", simulador: "../simuladores/sim-05-chavetas-chaveteros.html" },
        { codigo: "SAE J429 / ISO 898-1", organismo: "SAE", titulo: "Requisitos mecánicos y de materiales para sujetadores roscados externos", aplicacion: "Especificación de resistencia de prueba (Sp), fluencia (Sy), precarga inicial (Fi) y torque de apriete en Grados SAE 5/8 y Clases ISO 8.8/10.9/12.9.", simulador: "../simuladores/sim-06-uniones-empernadas.html" },
        { codigo: "API 686 / ANSI S2.75", organismo: "API", titulo: "Prácticas recomendadas para instalación de maquinaria y alineamiento de ejes", aplicacion: "Tolerancias máximas de desalineamiento paralelo (offset) y angular según RPM y corrección de pata coja (soft foot).", simulador: "../simuladores/sim-13-alineamiento-ejes.html" },
        { codigo: "ANSI/ASME B29.1", organismo: "ASME", titulo: "Cadenas de rodillos de transmisión de potencia de precisión y ruedas dentadas", aplicacion: "Selección de paso de cadena, efecto poligonal, capacidad de potencia y régimen de lubricación (Tipos I, II y III).", simulador: "../simuladores/sim-09-transmision-cadenas.html" }
      ];

      const normasData = (window.MECHPLANT_DB && Array.isArray(window.MECHPLANT_DB.normas) && window.MECHPLANT_DB.normas.length)
        ? window.MECHPLANT_DB.normas
        : FALLBACK_NORMAS;

      const grid = document.getElementById("normas-grid");
      const filterBar = document.getElementById("normas-filter-bar");

      function renderNormas(org) {
        const filtered = org === "ALL"
          ? normasData
          : normasData.filter(n => (n.organismo || n.codigo || "").toUpperCase().includes(org));

        grid.innerHTML = filtered.map(n => `
          <article class="mp-card" style="display:flex; flex-direction:column; justify-content:space-between;">
            <div>
              <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px;">
                <span class="tech-badge tech-badge--cyan">${n.codigo}</span>
                <span style="font-size:0.76rem; font-weight:700; color:var(--text-muted);">${n.organismo || ""}</span>
              </div>
              <h2 style="font-size:1.05rem; color:var(--color-navy-800); margin-bottom:8px;">${n.titulo}</h2>
              <p style="font-size:0.86rem; color:var(--text-secondary); margin-bottom:14px;">${n.aplicacion || n.descripcion || ""}</p>
            </div>
            ${n.simulador ? `<a href="${n.simulador}" class="btn btn--outline-dark" style="font-size:0.8rem; align-self:flex-start;">⚡ Abrir Simulador Asociado</a>` : ""}
          </article>
        `).join("");
      }

      filterBar.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-org]");
        if (!btn) return;
        filterBar.querySelectorAll("button").forEach(b => {
          b.className = "btn btn--outline-dark";
        });
        btn.className = "btn btn--primary";
        renderNormas(btn.dataset.org);
      });

      renderNormas("ALL");
    })();
  </script>
</body>
</html>
